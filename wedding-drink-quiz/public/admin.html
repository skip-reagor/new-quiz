<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Admin</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head>
<body><main class="wrap admin-wrap"><header class="hero"><p class="kicker">Private dashboard</p><h1>Wedding quiz admin</h1><p class="lede">Guest results and notes, in one place.</p></header>
<section class="card" id="login-view"><h2 class="prompt">Sign in</h2><form id="login-form"><label for="password">Admin password</label><input id="password" type="password" required autocomplete="current-password"><p class="error" id="login-error"></p><button class="primary" type="submit">Open dashboard</button></form></section>
<section class="hidden" id="dashboard-view"><div class="summary"><article><p>Total quiz results</p><strong id="total-results">0</strong></article><article><p>Messages for the couple</p><strong id="total-messages">0</strong></article></div><section class="card"><div class="section-head"><div><p class="eyebrow">Popular picks</p><h2>Drink results</h2></div><button class="ghost" id="refresh" type="button">Refresh</button></div><div id="outcomes" class="outcomes"></div></section><section class="card"><div class="section-head"><div><p class="eyebrow">Guestbook</p><h2>Guest results &amp; messages</h2></div><button class="ghost" id="logout" type="button">Sign out</button></div><div id="responses" class="responses"></div></section></section></main><script src="admin.js"></script></body></html>
